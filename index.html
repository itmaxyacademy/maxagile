<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaxAgile - Task & Workspace Management</title>
    <link rel="manifest" href="/maxagile/manifest.json" />
    <link rel="icon" href="/maxagile/favicon.png" />
    <link rel="apple-touch-icon" href="/maxagile/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/maxagile/service-worker.js', { scope: '/maxagile/' });
        });
      }
    </script>
  </body>
</html>
